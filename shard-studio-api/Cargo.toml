[package]
name = "shard-studio-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "fmt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
error-stack = { version = "0.8.0", features = ["anyhow"] }
rand = "0.10.3"
rand_distr = "0.6.0"
fake = "5.1.0"
bollard = "0.21.1"
futures-util = "0.3.34"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }

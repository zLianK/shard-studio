services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shard-studio-nginx
    restart: unless-stopped

    ports:
      - "8088:80"

    volumes:
      - ../shard-studio-api/reports:/usr/share/nginx/html:ro
      - ./nginx/reports.conf:/etc/nginx/conf.d/default.conf:ro


  grafana:
    image: grafana/grafana:12.2.0
    container_name: shard-studio-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      # Habilita acesso anônimo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

      # Instala o plugin Infinity
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource

    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - nginx

